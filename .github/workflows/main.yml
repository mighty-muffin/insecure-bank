---
name: CI - Main
run-name: Continuous Integration on ${{ github.head_ref || github.ref_name }} by ${{ github.actor }}

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  SNYK_VERSION: "1.1301.0"
  SNYK_DELTA: "1.12.7"

jobs:

  pre-commit:
    name: Pre-Commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Pre-Commit Checks
        uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        env:
          SKIP: "pytest, uv-export"

  secret:
    needs:
      - pre-commit
    name: Secret Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

  changes:
    needs:
      - pre-commit
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      js: ${{ steps.filter.outputs.js }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      java: ${{ steps.filter.outputs.java }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            dotnet:
              - 'dotnet/**'
            js:
              - 'js/**'
            java:
              - 'java-mvn/**'
            python:
              - 'python/**'

  # ── DOTNET ────────────────────────────────────────────────────────────────

  dotnet_build:
    needs:
      - changes
    if: needs.changes.outputs.dotnet == 'true'
    name: .NET - Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "3.1.x"

      - name: Restore dependencies
        run: |
          dotnet restore
        shell: bash

      - name: Build
        run: |
          dotnet build --no-restore --configuration Release
        shell: bash

  # ── Java ──────────────────────────────────────────────────────────────────

  java_build:
    needs:
      - changes
    if: needs.changes.outputs.java == 'true'
    name: Java - Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: java-mvn

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Test
        run: |
          mvn clean verify -DskipTests=false
        shell: bash

  # ── JavaScript ────────────────────────────────────────────────────────────

  js_build:
    needs:
      - changes
    if: needs.changes.outputs.js == 'true'
    name: JS - Build & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
        shell: bash

      - name: Lint
        run: |
          npm run lint:check
        shell: bash

      - name: Format check
        run: |
          npm run format:check
        shell: bash

  # ── Python ────────────────────────────────────────────────────────────────

  python_build:
    needs:
      - changes
    if: needs.changes.outputs.python == 'true'
    name: Python - Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UV
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "python/uv.lock"
          version: 0.9.18

      - name: Setup Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev --frozen
        shell: bash

      - name: Run Playwright install
        run: |
          uv run playwright install --with-deps
        shell: bash

      - name: Run tests
        run: |
          uv run pytest
        shell: bash

      - name: Minimize UV cache
        run: |
          uv cache prune --ci
        shell: bash

  # ── Gate ──────────────────────────────────────────────────────────────────

  gating:
    needs:
      - changes
      - dotnet_build
      - java_build
      - js_build
      - python_build
      - secret
    if: always()
    name: Gating
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check all required jobs
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All jobs passed or were intentionally skipped."
        shell: bash
