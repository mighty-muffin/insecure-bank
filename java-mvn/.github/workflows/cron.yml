---
name: CI - Schedule

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-cron-${{ github.workflow }}
  cancel-in-progress: true

jobs:

  renovate:
    name: Renovate Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          # Use a personal access token with repo scope for Renovate
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v40.3.2
        with:
          # Renovate configuration file
          configurationFile: .github/renovate.json
          # Use Mend.io token for self-hosted Renovate
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Set log level for debugging (optional)
          LOG_LEVEL: 'info'
          # Use GitHub token for API calls
          GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM: 'github'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
